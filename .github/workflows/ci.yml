name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

  release-16kb:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release bundle
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Install NDK llvm-readelf
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y llvm

      - name: Verify 16 KB native alignment (arm64-v8a)
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          TMP=$(mktemp -d)
          unzip -q "$AAB" -d "$TMP"
          FAILED=0
          for so in "$TMP"/base/lib/arm64-v8a/*.so; do
            ALIGN=$(readelf -lW "$so" | awk '/LOAD/ {print $NF; exit}')
            VAL=$((ALIGN))
            if [ "$VAL" -lt 16384 ]; then
              echo "FAIL: $(basename "$so") align=$ALIGN"
              FAILED=1
            fi
          done
          rm -rf "$TMP"
          if [ "$FAILED" -ne 0 ]; then exit 1; fi
          echo "All arm64-v8a libraries pass 16 KB alignment."
